version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.servicesessentials.ibm.com/v1}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-5-5}
      - LLM_PROVIDER=${LLM_PROVIDER:-ibm}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitshield-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
